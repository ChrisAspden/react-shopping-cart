version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres_dev
    restart: always
    environment:
      POSTGRES_USER: chris
      POSTGRES_PASSWORD: secretpass
      POSTGRES_DB: shopping_cart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
